# Render Blueprint for the FastAPI backend (free plan). The frontend is on Vercel and proxies
# /api/* here, so browsers never call this service or FPL directly.
# Setup steps: docs/deploy.md. The Claude key is entered in Render's dashboard, never committed.
services:
  - type: web
    name: fpl-planner-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANTHROPIC_API_KEY
        sync: false # asked for when the Blueprint is created
      - key: EXPLAIN_DAILY_CALLS
        value: "200"
